findings:
    - id: f-001
      date: "2026-07-25"
      slice: phase-0-gate
      severity: P3
      category: protocol
      finding: 'Gate report (.metis/briefs/phase-0-gate.md) provides no evidence for the OVERVIEW.md §3.4 invariant ''All copy about metis behavior must match the real CLI.'' The report evidences 4 of 5 §3.4 invariants (verify green, zero client JS, WCAG AA + both schemes styled, prefers-reduced-motion) but is silent on copy accuracy. Independent check confirms the placeholder copy in all six section components makes no CLI-behavior claims (no command output, no flags), so the invariant is vacuously satisfied today -- but the report should say so explicitly, the way it already documents the ADR prerequisite as ''vacuously satisfied'' in §1. Fix: add one line/row to the gate report (e.g. in §2 or §4) stating the copy-accuracy invariant was checked and holds vacuously (no CLI claims in placeholder copy yet); re-flip once added. This is a documentation-completeness gap, not a defect in the underlying build -- all re-run composition scenarios (clean build, token closure, built-output structure, all 8 WCAG ratio recomputations) independently reproduced exactly.'
      status: open
    - id: f-002
      date: "2026-07-26"
      slice: phase-0-gate
      severity: P3
      category: protocol
      finding: 'Scenario 5 (copy-accuracy) scopes its check to ''the six section components (src/components/*.astro) that carry all page copy'' and concludes the OVERVIEW.md §3.4 copy-accuracy invariant is ''vacuously satisfied -- no CLI claims exist.'' That scope statement is inaccurate: src/pages/index.astro:16-18 also carries page copy -- the <title> and og:description meta text (''metis governs AI coding agents with a disciplined protocol: one slice at a time, file scope as a contract, and cross-vendor review...'') -- which Scenario 5 never examined. This IS copy about metis behavior, so the invariant is not vacuously satisfied (nothing to check) but substantively satisfied (a real behavioral claim that happens to match reality: one slice at a time matches the ledger''s single active-slice model, file scope as a contract matches brief owned_paths, cross-vendor review matches the instructions'' ''Reviews are cross-vendor by default''). The underlying invariant holds -- this is not a build defect -- but the report''s evidence trail misstates its own scope and mischaracterizes vacuous vs. substantive satisfaction, the same class of evidence-completeness gap as f-001. Fix: extend Scenario 5''s Setup to include src/pages/index.astro''s title/description, and correct the verdict language from ''vacuously satisfied'' to reflect the one substantive (and accurate) behavioral claim found there.'
      status: open
